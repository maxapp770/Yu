plugins { id 'com.android.application' }
// One selected distribution per Gradle build: -PhecRole=customer (default) or admin.
// The SDK build-apk.sh produces identical assets/manifests without a Gradle download.
def hecRole = providers.gradleProperty('hecRole').getOrElse('customer')
if (!(hecRole in ['customer', 'admin'])) throw new GradleException('Invalid hecRole')
def variantRoot = "${rootProject.projectDir}/build/variants/${hecRole}"
def prepareHec = tasks.register('prepareHec', Exec) {
 workingDir rootProject.projectDir
 commandLine 'python3', 'tools/prepare_variant.py', hecRole
}
android {
 namespace 'com.alhaitham.hec'
 compileSdk 35
 defaultConfig {
  applicationId hecRole == 'admin' ? 'com.alhaitham.hec.admin' : 'com.alhaitham.hec.preview'
  minSdk 29; targetSdk 35; versionCode 17; versionName '2.5.0'
 }
 sourceSets {
  main {
   manifest.srcFile "${variantRoot}/AndroidManifest.xml"
   assets.srcDirs = ["${variantRoot}/assets"]
   java.srcDirs = ['src/main/java', "${variantRoot}/java"]
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 signingConfigs {
  debug {
   storeFile file(System.getenv('HEC_DEBUG_KEYSTORE') ?: new File(System.getProperty('user.home'), '.android/hec-preview-debug.keystore').path)
   storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android'
  }
 }
 buildTypes { debug { debuggable false; signingConfig signingConfigs.debug }; release { minifyEnabled false } }
}
preBuild.dependsOn prepareHec
dependencies { implementation files('libs/zxing-core-3.5.3.jar') }
