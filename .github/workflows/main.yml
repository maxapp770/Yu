name: HEC Android Cloud Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant:
          - customer
          - admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract source parts
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf assembled build
          mkdir -p assembled build

          for archive in \
            01-android-project.zip \
            02-service.zip \
            03-web-assets.zip \
            04-docs-and-tests.zip
          do
            test -f "$archive" || {
              echo "::error::Missing archive: $archive"
              exit 1
            }

            unzip -q -o "$archive" -d assembled
          done

      - name: Fix BarcodeDecoder
        shell: bash
        run: |
          set -Eeuo pipefail

          decoder="$(find assembled \
            -type f \
            -path "*/app/src/main/java/com/alhaitham/hec/BarcodeDecoder.java" \
            -print \
            -quit || true)"

          test -n "$decoder" || {
            echo "::error::BarcodeDecoder.java was not found."
            exit 1
          }

          sed -i \
            's/catch (ReaderException | IllegalArgumentException ignored)/catch (IllegalArgumentException ignored)/' \
            "$decoder"

          sed -i \
            '/import com.google.zxing.ReaderException;/d' \
            "$decoder"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        shell: bash
        env:
          HEC_APP_ROLE: ${{ matrix.variant }}
          HEC_SERVICE_ORIGIN: https://hec-service-review.fadhel-motaher.chatgpt.site
        run: |
          set -Eeuo pipefail

          build_script="$(find assembled \
            -type f \
            -name "build-apk.sh" \
            -print \
            -quit || true)"

          if [[ -n "$build_script" ]]; then
            project_dir="$(dirname "$build_script")"
            script_name="$(basename "$build_script")"

            chmod +x "$build_script"

            (
              cd "$project_dir"
              bash "./$script_name"
            )
          else
            gradlew="$(find assembled \
              -type f \
              -name "gradlew" \
              -print \
              -quit || true)"

            test -n "$gradlew" || {
              echo "::error::Neither build-apk.sh nor gradlew was found."
              exit 1
            }

            project_dir="$(dirname "$gradlew")"

            chmod +x "$gradlew"

            (
              cd "$project_dir"
              ./gradlew assembleDebug \
                --no-daemon \
                --stacktrace
            )
          fi

          apk_file="$(find assembled \
            -type f \
            -name "HEC-phase1-debug.apk" \
            -print \
            -quit || true)"

          if [[ -z "$apk_file" ]]; then
            apk_file="$(find assembled \
              -type f \
              -path "*/build/outputs/apk/*.apk" \
              -print \
              -quit || true)"
          fi

          test -n "$apk_file" || {
            echo "::error::No APK was found after build."
            find assembled -maxdepth 8 -type f | sort
            exit 1
          }

          echo "APK found: $apk_file"

          unsigned_apk="$apk_file"
          aligned_apk="build/HEC-${HEC_APP_ROLE}-aligned.apk"
          output_apk="build/HEC-${HEC_APP_ROLE}-2.6.0.apk"
          keystore="build/hec-release.keystore"

          keytool -genkeypair -v \
            -keystore "$keystore" \
            -storepass android \
            -keypass android \
            -alias hec \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=HEC, OU=HEC, O=HEC, C=YE"

          zipalign="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$zipalign"
          test -x "$apksigner"

          "$zipalign" -f -p 4 \
            "$unsigned_apk" \
            "$aligned_apk"

          "$apksigner" sign \
            --ks "$keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$output_apk" \
            "$aligned_apk"

          "$apksigner" verify \
            --verbose \
            "$output_apk"

          ls -lh "$output_apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HEC-2.6.0-${{ matrix.variant }}
          path: build/HEC-${{ matrix.variant }}-2.6.0.apk
          if-no-files-found: error
